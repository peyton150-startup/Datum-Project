name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: datum, POSTGRES_USER: datum, POSTGRES_PASSWORD: datum}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datum" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint + complexity
        run: ruff check .
      - name: Type check (kernel modules)
        run: mypy datum/reconcile datum/intent datum/graph
      # CF-3, the sharp edge. scripts/gen_ts_enums.py is the single source of
      # truth binding Python enums to TypeScript, and nothing verified that the
      # generated file still matched its source -- so the two languages could
      # disagree about what `open` or `partial` means with CI green.
      #
      # Checked in this job rather than the web one because it needs Python and
      # its dependencies, which are already installed here. Both jobs run on
      # every push and pull request, so a hand-edited enums.ts is caught either
      # way; the only difference is not installing Python twice.
      - name: Generated enums match their Python source
        run: |
          python scripts/gen_ts_enums.py
          git diff --exit-code -- web/src/enums.ts
      - name: Tests + coverage
        run: pytest
      # --no-cov is load-bearing: without it this second pytest run overwrites
      # .coverage with data from the acceptance slice alone, and the kernel
      # coverage gate below then reads that partial file instead of the full run.
      - name: Phase 1 smoke test (acceptance slice)
        run: pytest tests/test_acceptance_slice.py -v --no-cov
      # datum/intent is gated alongside the kernel: the quality objectives rank
      # intent ingestion correctness-first, and it is the barricade for the
      # declared plane. It entered the gate at 100% branch coverage in phase 2.
      #
      # datum/discovery joined in phase 3. Collectors are the robustness zone
      # rather than the kernel, so this is not a claim that they are kernel
      # code. It is gated because the framework owns the counts and their
      # invariant, and because CF-1 was a defect in exactly the branch an
      # untested collector never takes: the one where a record is bad and the
      # run has to keep going.
      #
      # datum/locks.py joined in phase 4, when reconciliation needed the same
      # exclusion as collector runs and the mechanism moved out of
      # datum/discovery -- where it had been gated -- to the top level, where it
      # would not have been. Boundary tier: it is what run_collector and
      # run_reconciliation are written against, and its uncovered branch is the
      # one where the lock is *not* granted, which is the only branch that
      # matters. Listed as a file rather than a glob so that a future top-level
      # module has to earn its place here deliberately.
      - name: Kernel branch coverage gate
        run: |
          coverage report --include="datum/reconcile/*,datum/workflow/*,datum/intent/*,datum/discovery/*,datum/locks.py" --fail-under=100

  # CF-3. Until this job existed, everything under web/ had zero automated
  # protection: the review queue, the API client, and the generated enums.
  # Nothing blocked it technically -- it waited by choice, and the standing cost
  # was that every web/ change was protected only by someone remembering to run
  # three commands. This is the same failure class as the Ratchet incident named
  # against work package 1.1.2: the safety net existed but was not covering the
  # thing.
  #
  # A separate job rather than steps in the build job, because Python and Node
  # share nothing here and a failure should say which language broke.
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Caching keeps this inside the free-tier budget the project is
          # constrained to; without it every run re-downloads the whole tree.
          cache: npm
          cache-dependency-path: web/package-lock.json
      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and the lock disagree, so a dependency cannot drift in
      # unnoticed the way the enums did.
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Runs tsc before vite, so this is the type check as well as the build.
      - name: Type check and build
        run: npm run build
      - name: Tests
        run: npm test

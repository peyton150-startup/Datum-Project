services:
  postgres:
    image: postgres:16
    # The test suite dies with it, and it has stopped on its own more than once
    # (exit 255, no compose command issued). `unless-stopped` rather than
    # `always` so a deliberate `docker compose stop` stays stopped.
    restart: unless-stopped
    environment:
      POSTGRES_DB: datum
      POSTGRES_USER: datum
      POSTGRES_PASSWORD: datum
    ports: ["5544:5432"]          # 5544 host-side to dodge a native Postgres collision
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datum"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports: ["6399:6379"]
    volumes: ["valkey-data:/data"]

  app:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      VALKEY_URL: redis://valkey:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
    ports: ["8000:8000"]
    volumes: [".:/app"]

  worker:
    build: .
    restart: unless-stopped
    command: celery -A datum.celery worker --beat --loglevel=info
    environment:
      POSTGRES_HOST: postgres
      VALKEY_URL: redis://valkey:6379/0
      # Intent repository. Unset means "not configured": the poll task logs and
      # does nothing rather than failing every interval.
      DATUM_INTENT_REPO_URL: ${DATUM_INTENT_REPO_URL:-}
      DATUM_INTENT_REPO_BRANCH: ${DATUM_INTENT_REPO_BRANCH:-main}
      DATUM_INTENT_POLL_SECONDS: ${DATUM_INTENT_POLL_SECONDS:-300}
      # Discovery. Unset means "no cluster to read": the collection task logs
      # and does nothing rather than failing every interval.
      DATUM_K8S_SOURCE: ${DATUM_K8S_SOURCE:-}
      DATUM_COLLECT_SECONDS: ${DATUM_COLLECT_SECONDS:-300}
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
    volumes: [".:/app"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on: [app]

volumes:
  postgres-data:
  valkey-data:

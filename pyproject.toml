[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datum"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==5.0.*",
    "django-ninja==1.3.*",
    "psycopg[binary]==3.2.*",
    "celery==5.4.*",
    "redis==5.0.*",            # Valkey speaks the Redis protocol
    "pydantic==2.*",
    "pyyaml==6.*",
    "kubernetes==31.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-django==4.*",
    "pytest-cov==5.*",
    "hypothesis==6.*",
    "ruff==0.6.*",
    "mypy==1.11.*",
    "django-stubs==5.*",
    "pre-commit==3.*",
]

# Only `datum` is a distributable package. Without this, setuptools flat-layout
# auto-discovery sees `web/` as a second top-level package and refuses to build.
[tool.setuptools.packages.find]
include = ["datum*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# SLF added by WBS 1.5.0. PlaneValue holds its state in a private field and
# exposes no value accessor, so `fd.declared._value` would reintroduce the
# collapsed reporting this project just removed -- one character longer than
# the line the design rejects. A test cannot police what other modules reach
# into; a linter can.
select = ["E", "F", "I", "UP", "B", "C901", "SLF"]
[tool.ruff.lint.per-file-ignores]
# SLF is off for tests deliberately. The rule exists to stop production call
# sites reaching around an interface -- `fd.declared._value` in service.py.
# Tests legitimately reach into privates to prove an invariant holds at the
# raw constructor and not only at the factories, which is the point of
# test_an_absent_value_carrying_a_value_is_unconstructible.
"tests/*" = ["C901", "SLF001"]
[tool.ruff.lint.mccabe]
max-complexity = 9          # C901 fires at 10 -> enforces "under 10"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
# strict ONLY on the kernel + boundary-critical modules
[[tool.mypy.overrides]]
module = ["datum.reconcile.*", "datum.intent.*", "datum.graph.*"]
strict = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# celery's @shared_task carries no annotations, so a strict module that uses it
# trips disallow_untyped_decorators. Relaxed for this one module rather than
# across the boundary layer; the task body is still checked strictly.
[[tool.mypy.overrides]]
module = ["datum.intent.tasks"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "datum.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "datum.settings"
addopts = "--cov=datum --cov-branch --cov-report=term-missing"
testpaths = ["tests", "datum"]
python_files = ["test_*.py", "tests.py"]

[tool.coverage.report]
# Kernel modules must stay branch-covered; fail CI if they slip.
fail_under = 0   # global gate is loose; kernel gate is enforced in CI (Task 3)
